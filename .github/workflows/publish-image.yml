name: Publish image to GHCR

# Builds the arm64 image on GitHub's native ARM runner and pushes it to
# GitHub Container Registry, so the server only has to pull an image.
#
# Image: ghcr.io/<owner>/<repo>:latest and :<full commit sha>

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push (arm64)
    # Native ARM64 runner: free for public repositories and much faster than
    # emulating arm64 on an amd64 runner.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        # GHCR requires a lowercase repository path; the owner name may not be.
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Write VERSION
        run: |
          echo "main-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)" > VERSION
          cat VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.image.outputs.name }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.image.outputs.name }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
